[project]
name = "slurm-manager"
version = "0.1.0"
description = "Django web console for managing and monitoring Slurm HPC clusters"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.0",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

